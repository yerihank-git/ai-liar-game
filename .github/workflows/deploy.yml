name: Deploy

# CI 워크플로우가 main 브랜치에서 성공적으로 완료된 후에만 배포
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

# 동시 배포 방지 — 이전 배포 완료 후 다음 배포 순차 실행
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Vercel 프로덕션 배포
    runs-on: ubuntu-latest
    environment: production
    # CI 워크플로우가 성공했을 때만 배포 실행
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Vercel CLI 설치
        run: npm install --global vercel@latest

      - name: Vercel 프로젝트 연결
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 프로덕션 빌드
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 프로덕션 배포
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: 배포 결과 요약
        run: |
          echo "## 🚀 프로덕션 배포 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 값 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 배포 URL | https://ai-liar-game.vercel.app |" >> $GITHUB_STEP_SUMMARY
          echo "| 커밋 | \`${{ github.event.workflow_run.head_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CI 상태 | ✅ 통과 후 배포 |" >> $GITHUB_STEP_SUMMARY
